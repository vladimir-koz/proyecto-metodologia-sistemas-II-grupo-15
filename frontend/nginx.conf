server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API no se expone desde el navegador: Nginx la reenvía al servicio backend.
    location /api/ {
        proxy_pass http://backend:3001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
